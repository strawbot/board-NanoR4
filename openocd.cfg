# openocd.cfg — SWD debug for RA4M1 via an ST-Link probe.
#
# No official OpenOCD target script exists for the Renesas RA family in this
# installed version (0.12.0) — only Synergy/R-Car/RZ are covered, not RA.
# RA4M1 is a plain Cortex-M4 with standard CoreSight debug infrastructure
# though, so a hand-rolled generic DAP/target (no vendor flash driver) works
# fine for live debugging: halt, breakpoints, memory read/write, reset.
#
# This is debug-only, not a flashing path — SWD-based flash programming
# would need RA4M1's actual flash controller parameters, which there's no
# vendor config here to confirm against. Keep using DFU for flashing
# (`pio run -t upload`); start a debug session separately to attach to
# whatever's already on the chip. See Docs/usb-handoff.md's "Debugging
# setup" section for the wider context (this replaced an old-firmware
# J-Link that needed a physical replug every session).

# stlink.cfg uses the older HLA driver (hla_swd/hla_jtag transports only,
# no plain swd/jtag support -- our generic Cortex-M target below needs
# plain swd). stlink-dap.cfg's native driver supports dapdirect_swd, which
# does. Needs ST-Link/V2 firmware >= V2J24 (or V2-1/V3, any firmware) --
# older V1/early-V2 would need the HLA path instead.
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd

# RA4M1's SW-DP IDCODE isn't confirmed here (no vendor config to check it
# against) -- skip strict ID verification rather than risk a wrong value
# blocking connection.
set _CHIPNAME ra4m1
swd newdap $_CHIPNAME cpu -expected-id 0
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap

# 1000 kHz produced intermittent failures ("undefined debug reason",
# "Failed to read memory") -- inconsistent between attempts, which points
# at signal integrity on this improvised probe-to-target wiring rather
# than a real target-side fault. Dropped hard as the cheapest first fix.
adapter speed 100

# Software reset via SYSRESETREQ -- the Nano's debug header wiring used
# this session (P108/P300 -> SWDIO/SWCLK, see Docs/usb-handoff.md) doesn't
# carry a physical reset line.
cortex_m reset_config sysresetreq

# Halt the target as part of OpenOCD's own startup, before any GDB client
# ever connects -- not just a convenience. GDB's "is the target running or
# stopped" belief is established from whatever state the target is ACTUALLY
# in at the moment `target remote`/`extended-remote` first connects, and a
# later `monitor halt` never corrects it even if the halt itself genuinely
# succeeds (monitor commands bypass GDB's own state tracking entirely).
# Symptom this caused: `info registers` reads back stable/correct values
# proving the target really is halted, yet `continue` still refuses with
# "Cannot execute this command while the target is running." Fix: make sure
# the target is already halted before GDB ever asks. See Docs/usb-handoff.md.
init
halt
