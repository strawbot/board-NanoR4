; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nano_r4]
upload_protocol = dfu
platform = renesas-ra
board = nano_r4

; SWD debug via a J-Link EDU-mini (modern probe/firmware -- replaced both
; the decade-old J-Link V8.00 that needed a physical replug every session,
; and the hand-rolled OpenOCD/ST-Link setup that connected/read memory
; fine but never actually got hardware breakpoints to program into
; silicon despite GDB reporting success at every step -- see
; Docs/usb-handoff.md's "Debugging setup" section for that whole detour.
; debug_tool = jlink normally supplies its own debug_init_cmds (PlatformIO
; auto-generates target/reset/load/pio_reset_*_target from jlink.py) --
; overridden here only to insert the one fix that's a genuine RA4M1
; property, not specific to any particular tool: the +0x08000000 symbol
; offset (see below). Everything else replicates PlatformIO's own default
; jlink template so pio_reset_halt_target/pio_reset_run_target (and thus
; VS Code's Restart button) keep working normally.
debug_tool = jlink
debug_svd_path = /Users/robchapm/.platformio/platforms/renesas-ra/misc/svd/R7FA4M1AB.svd
; add-symbol-file -o 0x08000000: RA4M1's SWD debug interface reports code
; addresses through a +0x08000000 alias; our linker script correctly places
; everything at the real 0x00000000-based flash addresses execution
; actually uses (see memory_regions_custom.ld). Without this offset, every
; breakpoint/backtrace/symbol lookup shows raw addresses that resolve to
; nothing ("??" everywhere) even though the target is running perfectly
; normal code -- confirmed via addr2line on captured PC values after
; subtracting 0x08000000 (resolved to real functions: R_BSP_IrqCfgEnable,
; sweep_poll). GDB auto-loads a SECOND, plain-addressed copy of every
; symbol too (from launching with the .elf on its command line) -- this
; isn't harmless: with both copies loaded, a breakpoint set by name/file:line
; (exactly how VS Code's UI sets one) can resolve to the WRONG (plain,
; un-offset) address, which the CPU never actually executes through.
; `symbol-file` with no argument clears the plain copy first so only the
; correct, offset one remains -- no ambiguity left to resolve wrong.
; See Docs/usb-handoff.md.
debug_init_cmds =
    define pio_reset_halt_target
        monitor reset
        monitor halt
    end
    define pio_reset_run_target
        monitor clrbp
        monitor reset
        monitor go
    end
    target extended-remote $DEBUG_PORT
    monitor clrbp
    monitor speed auto
    symbol-file
    add-symbol-file $PROG_PATH -o 0x08000000
    pio_reset_halt_target
    $LOAD_CMDS
    $INIT_BREAK
; NOTE: framework = fsp intentionally disabled — the bundled framework-renesas-fsp
; package lags behind our RASC-generated FSP 6.2.0. We compile the local ra/
; tree (including CMSIS, startup.c, system.c) so versions stay aligned.
;
; PIO defaults to gcc-arm-none-eabi 7.2.1 which is too old for FSP 6.2's
; linker script (rejects "ALIGN(.,512)" before the colon). Pin a modern one.
platform_packages =
    toolchain-gccarmnoneeabi @ ~1.120301.0

; TimbreOS is a flat folder of .c/.h files (no library.json / src/ layout), so
; lib_extra_dirs can't auto-discover it. Pull its sources in directly below
; and rely on the -I ../TimbreOS flag for headers.
;
; Excluded TimbreOS sources:
;   - printersHost.c : host-side output only, not for embedded build
;
; gpio_dump.c is still STM32-only and excluded.
; ra_gen/main.c is the generated `int main(void) { hal_entry(); }` shim that
; satisfies startup.c's Reset_Handler — keep it in the build.
; mocks.c is portable and supplies system_failure / output / show_cli.
build_src_filter =
    +<*>
    +<../Board/**/*>
    -<../Board/gpio_dump.c>
    ; usb_init.c provides the real usbisr/usbinit/usbcrash/usbtrace/usbpoll
    ; CLI words in this (the real, TinyUSB) build; usb_init_stubs.c is only
    ; for env:nano_r4_usbtest, which excludes usb_init.c instead — see that
    ; environment below and Docs/usb-handoff.md, "Native stack smoke test".
    -<../Board/usb_init_stubs.c>
    +<../Limbs/*.c>
    +<../../TimbreOS/*.c>
    -<../../TimbreOS/printersHost.c>
    +<../ra_gen/*.c>
    +<../ra/**/*.c>
    +<../ra/**/*.S>
    ; Dead: RASC's native USB stack (r_usb_basic/r_usb_pcdc/r_usb_composite) is
    ; configured in the Stacks tab but never opened — TinyUSB is the real
    ; device stack. Worse than unused: r_usb_mcu.c's usbfs_interrupt_handler
    ; was silently claiming the USBFS_INT vector instead of our usbfs_int_isr
    ; (see ra_gen/vector_data.c) — excluding it removes both the dead code
    ; and that collision. See Docs/usb-handoff.md.
    -<../ra/fsp/src/r_usb_basic/**/*>
    -<../ra/fsp/src/r_usb_pcdc/**/*>
    -<../ra/fsp/src/r_usb_composite/**/*>
    -<../../TimbreOS/hash_32.c>
    -<../../TimbreOS/printersHost.c>
    -<../../TimbreOS/timestamp.c>
    -<../../TimbreOS/hash_32.c>
    -<../../TimbreOS/valueTransfer.c>
    +<../../Robot/cli/*.c>
    +<../../Robot/diagnostics/canary/*.c>
    +<../../Robot/io/ads1015/*.c>
    +<../../Robot/io/mcp4728/*.c>
    +<../../Robot/io/mpu6050/*.c>
    +<../../Robot/storage/fs/*.c>
    ; TinyUSB — core + DFU Runtime + CDC classes + Renesas RUSB2 device driver
    +<../../tinyusb/src/tusb.c>
    +<../../tinyusb/src/common/tusb_fifo.c>
    +<../../tinyusb/src/device/usbd.c>
    +<../../tinyusb/src/device/usbd_control.c>
    +<../../tinyusb/src/class/dfu/dfu_rt_device.c>
    +<../../tinyusb/src/class/cdc/cdc_device.c>
    +<../../tinyusb/src/portable/renesas/rusb2/dcd_rusb2.c>
    +<../../tinyusb/src/portable/renesas/rusb2/rusb2_common.c>

; Include paths and macros mirror RASC's buildinfo.json.
build_flags =
    ; -g doesn't change the generated code (same -Os, same addresses) --
    ; it just embeds DWARF debug info in the .elf alongside it. Without
    ; this, gdb reports "No debugging symbols found" and every backtrace
    ; frame shows as ?? regardless of whether the .elf actually matches
    ; what's flashed -- this was true for every build all session, not a
    ; regression. See Docs/usb-handoff.md.
    -g
    -I .
    -I Board
    -I Board/include
    -I ../TimbreOS
    -I ra_gen
    -I ra_cfg/fsp_cfg
    -I ra_cfg/fsp_cfg/bsp
    -I ra/arm/CMSIS_6/CMSIS/Core/Include
    -I ra/fsp/inc
    -I ra/fsp/inc/api
    -I ra/fsp/inc/instances
    -I ../Robot/cli
    -I ../Robot/diagnostics/canary
    -I ../Robot/io/ads1015
    -I ../Robot/io/mcp4728
    -I ../Robot/io/mpu6050
    -I ../Robot/storage/fs
    -I ../tinyusb/src
    -D_RA_CORE=CM4
    -D_RA_ORDINAL=1
    -D_RENESAS_RA_
    --specs=nosys.specs
    --specs=nano.specs   ; optional — pulls in the size-optimized "newlib-nano" too

; RASC-provided linker script — defines memory regions for the RA4M1.
board_build.ldscript = script/fsp.ld
extra_scripts =
    pre:Scripts/gen_build_timestamp.py
    pre:Scripts/run_parsewords.py
;    pre:Scripts/kill_stale_debuggers.py
    post:Scripts/report_memory.py
; Pre-build scripts — uncomment when ready:
;     pre:Scripts/run_pin_gen.py      ; needs rewrite for RASC pin format (was STM32 CubeMX)

; ── nano_r4_double — 64 bit CLI floats ─────────────────────────────────────────
;
; Same firmware with TimbreOS's -DFLOAT_DOUBLE: CLI floats are doubles held
; in float.c's tagged index pool (see its "Float pool" comment). Costs about
; 10 KB of flash (double libm, soft-float on the M4F) and ~0.5 KB of RAM.
[env:nano_r4_double]
extends = env:nano_r4
build_flags =
    ${env:nano_r4.build_flags}
    -D FLOAT_DOUBLE

; ── nano_r4_usbtest — native r_usb_basic + r_usb_pcdc smoke test ───────────────
;
; A throwaway, standalone build: does RASC's native USB driver's interrupt
; path stay alive under real host traffic, or does it wedge the same way
; TinyUSB's did before the scheduler-poll workaround (Board/usb_init.c)?
; See Docs/usb-handoff.md, "Native stack smoke test".
;
; Swaps usb_transport_init() (TinyUSB) for usb_native_test_init() (native)
; via -D USE_NATIVE_USB_STACK — see src/hal_entry.c and
; ra_gen/vector_data.c's conditional vector-6 entry. Everything else
; (CLI, scheduler, all non-USB peripherals) is identical to env:nano_r4.
[env:nano_r4_usbtest]
extends = env:nano_r4
build_flags =
    ${env:nano_r4.build_flags}
    -D USE_NATIVE_USB_STACK
build_src_filter =
    ${env:nano_r4.build_src_filter}
    ; Pull in the native stack the base env excludes...
    +<../ra/fsp/src/r_usb_basic/**/*>
    +<../ra/fsp/src/r_usb_pcdc/**/*>
    ; ...and drop TinyUSB and the TinyUSB-only board glue entirely — the
    ; two stacks can't coexist on one physical peripheral/vector. Swap
    ; usb_init.c's CLI words for usb_init_stubs.c's (the base env excludes
    ; the stub file since it would collide with usb_init.c's real ones —
    ; reverse that here).
    -<../../tinyusb/**/*>
    -<../Board/usb_init.c>
    +<../Board/usb_init_stubs.c>
    -<../../Robot/cli/cli_transport_cdc.c>